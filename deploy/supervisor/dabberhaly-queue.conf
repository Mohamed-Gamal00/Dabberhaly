; Dabberhaly queue worker — Supervisor program.
;
; Install:
;   sudo cp deploy/supervisor/dabberhaly-queue.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl start dabberhaly-queue
;
; Replace /var/www/dabberhaly with the real project path and www-data with
; the user PHP runs as on the server.
;
; --timeout=120 must stay BELOW config/queue.php database retry_after=180
; (the newsletter listener can run up to 120s). If a job runs longer than
; retry_after it is released while still running and executes twice.
; --tries=3: a job that fails 3 times is moved to failed_jobs.

[program:dabberhaly-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/dabberhaly/artisan queue:work database --sleep=3 --tries=3 --timeout=120
directory=/var/www/dabberhaly
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/dabberhaly/storage/logs/queue-worker.log
stopwaitsecs=190
